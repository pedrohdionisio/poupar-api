listAccountMerchants:
  handler: src/main/functions/accountMerchants/listAccountMerchants.handler
  events:
    - httpApi:
        path: /account-merchants
        method: GET
        authorizer:
          name: CognitoAuthorizer
getAccountMerchant:
  handler: src/main/functions/accountMerchants/getAccountMerchant.handler
  events:
    - httpApi:
        path: /account-merchants/{cnpj}
        method: GET
        authorizer:
          name: CognitoAuthorizer
updateAccountMerchant:
  handler: src/main/functions/accountMerchants/updateAccountMerchant.handler
  events:
    - httpApi:
        path: /account-merchants/{cnpj}
        method: PUT
        authorizer:
          name: CognitoAuthorizer
deleteAccountMerchant:
  handler: src/main/functions/accountMerchants/deleteAccountMerchant.handler
  events:
    - httpApi:
        path: /account-merchants/{cnpj}
        method: DELETE
        authorizer:
          name: CognitoAuthorizer
