getReceipt:
  handler: src/main/functions/receipts/getReceipt.handler
  events:
    - httpApi:
        path: /purchases/{purchaseId}/receipt
        method: GET
        authorizer:
          name: CognitoAuthorizer
createReceipt:
  handler: src/main/functions/receipts/createReceipt.handler
  events:
    - httpApi:
        path: /purchases/{purchaseId}/receipt
        method: POST
        authorizer:
          name: CognitoAuthorizer
