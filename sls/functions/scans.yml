createScan:
  handler: src/main/functions/scans/createScan.handler
  events:
    - httpApi:
        path: /scans
        method: POST
        authorizer:
          name: CognitoAuthorizer
confirmScan:
  handler: src/main/functions/scans/confirmScan.handler
  events:
    - httpApi:
        path: /scans/{scanId}/confirm
        method: POST
        authorizer:
          name: CognitoAuthorizer
getScan:
  handler: src/main/functions/scans/getScan.handler
  events:
    - httpApi:
        path: /scans/{scanId}
        method: GET
        authorizer:
          name: CognitoAuthorizer
processScan:
  handler: src/main/functions/scans/processScan.handler
  timeout: 120
  memorySize: 1024
  events:
    - sqs:
        arn: !GetAtt ScansQueue.Arn
        batchSize: 1
        maximumConcurrency: 5
