Resources:
  UploadsBucket:
    Type: AWS::S3::Bucket
    DependsOn: ScansQueuePolicy
    Properties:
      BucketName: ${self:service}-${self:provider.stage}-uploads-${aws:accountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireScans
            Status: Enabled
            Prefix: scans/
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt ScansQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: scans/
